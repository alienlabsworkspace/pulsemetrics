global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pulsemetrics-api'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: 'api'

  - job_name: 'pulsemetrics-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4001']
        labels:
          service: 'worker'

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'
